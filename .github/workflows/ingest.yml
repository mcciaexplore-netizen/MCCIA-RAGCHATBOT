name: Keep the archive current (Phase 6)

# Weekly, matching the original design's EventBridge cadence -- Sampada is a
# monthly magazine, so daily/hourly polling would just be wasted API calls.
# workflow_dispatch is here so a run can be triggered manually to verify a
# secret change or debug a failure without waiting for Monday.
on:
  schedule:
    - cron: "0 3 * * 1" # Monday 03:00 UTC
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # sync_all() only re-downloads PDFs that are new or changed size (see
      # ingest/drive_sync.py) -- without this, every run starts from an
      # empty staging/raw/ and re-downloads the entire 70-year archive from
      # Drive every week just to skip re-processing it. The key always
      # misses on `save` (run_id is unique per run) so every run's state
      # gets saved, and `restore-keys` falls back to the most recent
      # previous entry -- there's no lockfile-style key that fits "whatever
      # Drive happens to contain this week".
      - uses: actions/cache@v4
        with:
          path: staging/
          key: sampada-staging-${{ github.run_id }}
          restore-keys: |
            sampada-staging-

      - name: Write the Drive service account key
        run: |
          mkdir -p secrets
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > secrets/drive-service-account.json
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      - name: Sync, process, and check the web archive
        run: python -m ingest.run_pipeline all
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GOOGLE_SERVICE_ACCOUNT_FILE: secrets/drive-service-account.json

      - name: Upload the manual-review log, if anything needed one
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-review-log
          path: staging/manual_review.csv
          if-no-files-found: ignore
